# VB OCR settings
# Edit this file to change how invoices are read and how the CSV is written.
# Restart the server after saving changes.
#
# Settings for THIS PC only (access key, oneDNN switch) go in settings.local.yaml next to
# this file. It overrides values here, is not stored in git, and is kept by update.bat.

server:
  host: 127.0.0.1      # use 0.0.0.0 to allow other computers on the network
  port: 5000
  # Access key for scans from other PCs. Empty = no key needed. When host is 0.0.0.0,
  # set a key in settings.local.yaml:   server: {api_key: "some-long-secret"}
  api_key: ""
  # The browser page checks once a day whether a newer VB OCR is on GitHub (needs internet;
  # nothing is sent except the request itself). false = never check.
  check_updates: true

ocr:
  # Passed straight to PaddleOCR. See docs/CONFIGURATION.md for details.
  lang: en
  # Model size: small = fast (default), medium = most accurate (about 2x slower).
  # Do not use tiny - it misreads numbers on invoices.
  text_detection_model_name: PP-OCRv6_small_det
  text_recognition_model_name: PP-OCRv6_small_rec
  use_doc_orientation_classify: true   # fixes photos taken sideways / upside down
  use_doc_unwarping: false             # set true for curled or folded paper (slower)
  use_textline_orientation: true
  # oneDNN = Intel CPU acceleration. Some Windows PCs fail with
  # "ConvertPirAttribute2RuntimeAttribute not support"; then VB OCR switches it off by
  # itself, and install.bat saves "enable_mkldnn: false" in settings.local.yaml.

# Your own business. Your GSTIN is printed on every purchase invoice (as the buyer); listing it
# here makes sure it is never taken as the supplier's GSTIN. Several: ["29AAA...", "33AAA..."]
company:
  gstin: []

# Phone photos are cleaned up before reading. Both steps only act when needed, so scans and
# screenshots are not changed.
photo:
  flatten_page: true      # photo taken at an angle: find the paper's corners, make it flat
  remove_shadows: true    # one side much darker than the other: even out the background

# PDFs made by a computer (e-mailed invoices) contain real text. It is read directly:
# faster than OCR and exact. Scanned PDFs (pictures of paper) are still read with OCR.
pdf:
  use_text_layer: true
  min_characters: 40      # fewer characters on a page = treat the page as scanned
  render_dpi: 200         # resolution for OCR of scanned PDF pages

# Checks that point the user to values that need a second look.
checks:
  # Values the OCR read with less confidence than this (0-1) are highlighted.
  min_confidence: 0.90
  # Compare the sum of the item amounts with the total printed on the invoice.
  total_labels: ["grand total", "net amount", "net total", "invoice total", "total amount",
                 "invoice value", "net payable", "amount payable", "total"]
  total_tolerance: 1.00   # rupees; covers round-off
  # When the totals differ, these lines are tried to explain the difference
  # (e.g. items + CGST + SGST + freight - discount + round off = grand total).
  tax_labels: ["cgst", "sgst", "igst", "utgst", "gst", "cess", "tcs"]
  charge_labels: ["freight", "packing", "forwarding", "transport", "courier", "cartage",
                  "insurance", "other charges", "round off", "rounding off", "rounded off", "roundoff"]
  discount_labels: ["discount", "cash discount", "trade discount", "scheme discount", "less"]

# Every scan is saved here (JSON + CSV), for the "Recent scans" list and duplicate warnings.
history:
  enabled: true
  folder: history         # relative to the VB OCR folder
  keep_days: 365          # older scans are deleted automatically (0 = keep forever)
  warn_duplicates: true   # same supplier + invoice number scanned before

# Scan every invoice that appears in a folder, while the server runs (e.g. the folder your
# scanner saves to). Each file = one invoice. CSV files go to <folder>\csv, scanned files are
# moved to <folder>\done (damaged ones to <folder>\failed). Empty folder = off.
# Also possible without the server:  python -m vbocr watch C:\Invoices\Inbox
watch:
  folder: ""              # e.g. C:\Invoices\Inbox
  output: ""              # default: <folder>\csv
  interval_seconds: 3

# Optional list of your items (CSV). Fills columns the invoice does not print, for example
# M.R.P, Size or Article ID, by matching the SKU. See config/item_master.example.csv.
item_master:
  file: config/item_master.csv
  overwrite: false        # true = values from the list replace values read from the invoice
  # Values you correct in the browser (Size, M.R.P, ...) are remembered per SKU and supplier
  # and filled in next time. Your own file above always wins.
  learn: true
  learned_file: config/item_master.learned.csv

output:
  date_format: "%d-%m-%Y"     # 03-01-2026. Use "%d/%m/%Y" for 03/01/2026
  include_total_row: true
  fill_date_with_today: false # put today's date in the "Date" column
  # Column used for the item quantity when the invoice has several.
  # The first header found wins.
  quantity_priority: ["total qty", "qty", "quantity", "mtrs", "meters", "pcs", "nos"]
  # Column used for the item amount. "total" is the line total incl. GST.
  amount_priority: ["total", "total amt", "total amount", "net amount", "amount", "value", "taxable value"]

# Labels printed next to header values on the invoice.
# Matching ignores case, spaces and punctuation at the end of the label.
header_fields:
  invoice_number: ["invoice no", "invoice number", "inv no", "bill no", "ref no"]
  invoice_date: ["invoice date", "inv date", "bill date", "ref date", "dated"]
  po_number: ["po no", "p o no", "po number", "order no", "purchase order no"]
  po_date: ["po date", "p o date", "order date", "purchase order date"]
  lr_booking_date: ["lr date", "l r date", "lr no & date", "lr no and date", "lr booking date"]
  brand: ["brand"]

# Table header names that map to each CSV column.
item_columns:
  serial: ["s.no", "s no", "sl.no", "sl no", "sr.no", "sr no", "sno", "slno", "srno", "#"]
  sku: ["item", "item code", "item id", "sku", "sku no", "product code", "code", "style code"]
  description: ["description of goods", "description", "particulars", "item description", "item name"]
  article_id: ["article", "article id", "article no", "art no"]
  brand: ["brand", "brand name"]
  design_name: ["design", "design name", "product", "product name", "style"]
  size: ["size"]
  cup_size: ["cup size", "cup"]
  colour: ["colour", "color", "shade"]
  cost_price: ["ws price", "rate", "cost price", "cost", "price", "unit price", "rate per unit"]
  mrp: ["mrp", "m.r.p", "m r p"]

# Tried in order on the item description. Named groups fill CSV columns
# (brand, design_name, article_id, sku, size, colour).
# Example: RAYMOND/CLASSIQUE/1315177 -> brand RAYMOND, design CLASSIQUE, article 1315177
description_patterns:
  - '^(?P<brand>[^/]+)/(?P<design_name>.+)/(?P<article_id>[^/]+)$'

# Colour codes found at the end of SKU codes (used when a supplier sets
# colour_from_sku_suffix in suppliers.yaml). A code not in this list is written to the
# CSV as it is (e.g. "XYZ"), so nothing is lost - add it here to get the full name.
# Codes marked * appear on the Opus Fashions / Maybell invoices.
colour_codes:
  AQU: Aqua
  BGE: Beige
  BLK: Black        # *
  BLU: Blue         # *
  BRG: Burgundy
  BRN: Brown        # *
  CHR: Charcoal
  COR: Coral
  CRM: Cream
  FUS: Fuchsia
  GLD: Gold
  GRN: Green        # *
  GRY: Grey         # *
  IVR: Ivory
  KHK: Khaki
  LAV: Lavender
  LEM: Lemon
  LIL: Lilac
  MAG: Magenta
  MNT: Mint
  MRN: Maroon       # *
  MST: Mustard      # *
  MUL: Multicolour
  MUV: Mauve
  NUD: Nude
  NVY: Navy
  OLV: Olive
  ONI: Onion Pink
  ORG: Orange
  PCH: Peach
  PNK: Pink         # *
  PRT: Print
  PUR: Purple       # *
  RED: Red          # *
  ROS: Rose
  RST: Rust         # *
  SKN: Skin
  SKY: Sky Blue
  SLV: Silver
  TEA: Teal
  TUR: Turquoise    # *
  WHT: White
  WIN: Wine
  YLW: Yellow
