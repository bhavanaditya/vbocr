name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  # Fast: the reading logic, without the OCR engine (Linux and Windows).
  unit-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: pip install pytest PyYAML Pillow numpy opencv-python-headless pypdfium2 fastapi python-multipart segno httpx
      - run: python -m pytest -q tests

  # The real thing on Windows: install.bat, OCR models, end-to-end scans, the VB.NET client,
  # and the Windows scripts.
  windows-full:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      VBOCR_YES: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "8.0.x"
      - uses: actions/cache@v5
        with:
          path: models
          key: ocr-models-${{ hashFiles('requirements.txt', 'config/settings.yaml') }}

      - name: install.bat (packages, models, oneDNN self-test)
        shell: cmd
        run: call install.bat

      - name: Test files
        shell: cmd
        run: .venv\Scripts\python.exe tests\make_test_files.py test-files

      - name: All tests, including end-to-end OCR
        shell: cmd
        env:
          VBOCR_OCR_TESTS: "1"
        run: |
          .venv\Scripts\python.exe -m pip install pytest
          .venv\Scripts\python.exe -m pytest -q tests

      - name: Command line scan
        shell: cmd
        run: |
          call scan.bat test-files\a_bill.jpg -o test-files\a_bill.csv
          type test-files\a_bill.csv
          findstr /C:"SG/25-26/0042" test-files\a_bill.csv

      - name: VB.NET build check (.NET 2.0 / VB 9 and .NET 4.5 / VB 15)
        run: dotnet build clients/vbnet/tests/BuildCheck

      # One step: Windows runners stop processes started by a step when that step ends.
      - name: VB.NET client and scan dialog against a server with an access key
        shell: pwsh
        run: |
          Add-Content config\settings.local.yaml "`nserver:`n  api_key: ci-key-123`n"
          Start-Process .venv\Scripts\python.exe -ArgumentList '-m','vbocr','serve','--port','5077' `
            -RedirectStandardError server.log -RedirectStandardOutput server.out.log -WindowStyle Hidden
          $ready = $false
          for ($i = 0; $i -lt 90 -and -not $ready; $i++) {
            try { $ready = (Invoke-RestMethod http://127.0.0.1:5077/health).status -eq 'ok' } catch {}
            if (-not $ready) { Start-Sleep 2 }
          }
          if (-not $ready) { Get-Content server.log -Tail 50; exit 1 }
          dotnet run --project clients/vbnet/tests/ClientTest -- http://127.0.0.1:5077 test-files ci-key-123
          if ($LASTEXITCODE -ne 0) { Get-Content server.log -Tail 50; exit 1 }
          dotnet run --project clients/vbnet/tests/DialogTest -- http://127.0.0.1:5077 test-files ci-key-123 dialog-screenshots
          if ($LASTEXITCODE -ne 0) { Get-Content server.log -Tail 50; exit 1 }

      - name: Dialog screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dialog-screenshots
          path: dialog-screenshots
          if-no-files-found: ignore

      - name: Diagnostics zip has logs and settings, without the access key
        shell: pwsh
        run: |
          $zip = (.venv\Scripts\python.exe -m vbocr diagnostics -o diagnostics.zip)
          if ($LASTEXITCODE -ne 0) { throw "diagnostics failed" }
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $archive = [IO.Compression.ZipFile]::OpenRead((Resolve-Path $zip))
          $names = $archive.Entries | ForEach-Object { $_.FullName }
          $archive.Dispose()
          $names
          if ($names -notcontains 'summary.json' -or $names -notcontains 'config/settings.local.yaml') { throw "missing files" }
          Expand-Archive $zip diag -Force
          if (Select-String -Path diag\config\* -Pattern 'ci-key-123' -SimpleMatch) { throw "access key in the zip" }

      - name: scan-folder.bat, watch-folder.bat, diagnostics.bat, start-server.bat
        shell: pwsh
        run: |
          # scan-folder.bat: one CSV per invoice
          New-Item -ItemType Directory sf, wf | Out-Null
          Copy-Item test-files\a_bill.jpg, test-files\b_bill.png sf
          cmd /c "scan-folder.bat sf -o sf-out < NUL"
          $csv = Get-ChildItem sf-out -Filter *.csv
          $csv.Name
          if ($csv.Count -ne 2) { throw "scan-folder.bat: expected 2 CSV files" }

          # watch-folder.bat: a file dropped in the folder is scanned and moved to done
          $watch = Start-Process cmd -ArgumentList '/c', 'watch-folder.bat wf wf-out < NUL' -PassThru -WindowStyle Hidden
          Start-Sleep 5
          Copy-Item test-files\a_bill.jpg wf
          $ok = $false
          for ($i = 0; $i -lt 90 -and -not $ok; $i++) {
            $ok = (Test-Path wf-out\a_bill.csv) -and (Test-Path wf\done\a_bill.jpg)
            if (-not $ok) { Start-Sleep 2 }
          }
          # a file another program keeps open (others may read, not move): scanned once, moved when closed
          if ($ok) {
            Copy-Item test-files\b_bill.png wf\locked.png
            $handle = [IO.File]::Open((Resolve-Path wf\locked.png), 'Open', 'Read', 'Read')
            for ($i = 0; $i -lt 60 -and -not (Test-Path wf-out\locked.csv); $i++) { Start-Sleep 2 }
            Start-Sleep 20
            $copies = @(Get-ChildItem wf-out -Filter 'locked*.csv').Count
            "CSV files while the file was open: $copies"
            $handle.Close()
            for ($i = 0; $i -lt 30 -and -not (Test-Path wf\done\locked.png); $i++) { Start-Sleep 2 }
            $moved = (Test-Path wf\done\locked.png) -and -not (Test-Path wf\locked.png)
            $doneCopies = @(Get-ChildItem wf\done -Filter 'locked*').Count
            if ($copies -ne 1) { $ok = $false; "scanned $copies times instead of once" }
            if (-not $moved -or $doneCopies -ne 1) { $ok = $false; "not moved to done once after closing ($doneCopies)" }
          }
          Get-CimInstance Win32_Process | Where-Object { $_.CommandLine -like '*vbocr watch*' } | ForEach-Object { Stop-Process -Id $_.ProcessId -Force }
          if (-not $ok) { throw "watch-folder.bat did not scan the file" }
          if (-not (Select-String -Path wf-out\a_bill.csv -Pattern 'SG/25-26/0042' -SimpleMatch -Quiet)) { throw "watch-folder.bat: wrong CSV" }

          # diagnostics.bat: zip saved in logs
          $out = cmd /c "diagnostics.bat < NUL"
          $out
          $zip = Get-ChildItem logs -Filter 'vbocr-diagnostics-*.zip'
          if (-not $zip) { throw "diagnostics.bat saved no zip" }

          # start-server.bat (passes its arguments on)
          Start-Process cmd -ArgumentList '/c', 'start-server.bat --port 5088 < NUL' -WindowStyle Hidden
          $ready = $false
          for ($i = 0; $i -lt 90 -and -not $ready; $i++) {
            try { $ready = (Invoke-RestMethod http://127.0.0.1:5088/health).status -eq 'ok' } catch {}
            if (-not $ready) { Start-Sleep 2 }
          }
          # a second start on the same port: told at once that VB OCR already runs (no 20 s engine load)
          if ($ready) {
            $t = Get-Date
            $second = .venv\Scripts\python.exe -m vbocr serve --port 5088 2>&1 | Out-String
            $code = $LASTEXITCODE; $secs = ((Get-Date) - $t).TotalSeconds
            "second start: exit $code after $([int]$secs) s: $second"
            if ($code -ne 0 -or $second -notmatch 'already running' -or $secs -gt 15) { $ready = $false; "second start not handled" }
          }
          Get-CimInstance Win32_Process | Where-Object { $_.CommandLine -like '*serve --port 5088*' } | ForEach-Object { Stop-Process -Id $_.ProcessId -Force }
          if (-not $ready) { throw "start-server.bat did not start the server" }

          # port taken by another program: clear message, exit code 2, fast
          $other = [Net.Sockets.TcpListener]::new([Net.IPAddress]::Loopback, 5097); $other.Start()
          $t = Get-Date
          $msg = .venv\Scripts\python.exe -m vbocr serve --port 5097 2>&1 | Out-String
          $code = $LASTEXITCODE; $secs = ((Get-Date) - $t).TotalSeconds
          $other.Stop()
          "busy port: exit $code after $([int]$secs) s: $msg"
          if ($code -ne 2 -or $msg -notmatch 'used by another program' -or $secs -gt 15) { throw "busy port not reported clearly" }

      - name: CSV open in Excel when scanning again
        shell: pwsh
        run: |
          $excel = [IO.File]::Open((Resolve-Path test-files\a_bill.csv), 'Open', 'ReadWrite', 'Read')
          cmd /c "scan.bat test-files\a_bill.jpg -o test-files\a_bill.csv < NUL"
          $excel.Close()
          if (-not (Test-Path "test-files\a_bill (2).csv")) { throw "the scan was lost because a_bill.csv was open" }
          if (-not (Select-String -Path "test-files\a_bill (2).csv" -Pattern 'SG/25-26/0042' -SimpleMatch -Quiet)) { throw "wrong CSV" }

      - name: File and folder names with spaces and Indian / accented letters
        shell: pwsh
        run: |
          $dir = New-Item -ItemType Directory "uni ü बिल" -Force
          Copy-Item test-files\a_bill.jpg (Join-Path $dir "बिल नंबर 1 ü.jpg")
          Copy-Item test-files\digital-invoice.pdf (Join-Path $dir "रसीद ü 2.pdf")
          # command line
          cmd /c "scan.bat --each `"$dir`" < NUL"
          $csv = Get-ChildItem $dir -Filter *.csv
          $csv.Name
          if ($csv.Count -ne 2) { throw "command line: expected 2 CSV files" }
          # server, with a user temp folder that has such letters too (user name like Rāj)
          $temp = New-Item -ItemType Directory "D:\temp Rāj बिल" -Force
          $env:TEMP = $temp.FullName; $env:TMP = $temp.FullName
          Start-Process .venv\Scripts\python.exe -ArgumentList '-m','vbocr','serve','--port','5099' -WindowStyle Hidden `
            -RedirectStandardError uni-server.log -RedirectStandardOutput uni-server.out.log
          $ready = $false
          for ($i = 0; $i -lt 90 -and -not $ready; $i++) {
            try { $ready = (Invoke-RestMethod http://127.0.0.1:5099/health).status -eq 'ok' } catch {}
            if (-not $ready) { Start-Sleep 2 }
          }
          if (-not $ready) { Get-Content uni-server.log -Tail 40; throw "server did not start" }
          foreach ($f in Get-ChildItem $dir -Exclude *.csv) {
            $r = Invoke-WebRequest "http://127.0.0.1:5099/scan?format=json" -Method Post -Headers @{ 'X-API-Key' = 'ci-key-123' } `
              -Form @{ files = $f }
            $json = $r.Content | ConvertFrom-Json
            "$($f.Name): $($json.items.Count) items, invoice $($json.header.invoice_number)"
            if ($json.items.Count -lt 1) { Get-Content uni-server.log -Tail 40; throw "server: no items for $($f.Name)" }
          }
          $hist = Invoke-RestMethod "http://127.0.0.1:5099/history?limit=5" -Headers @{ 'X-API-Key' = 'ci-key-123' }
          $hist.scans | ForEach-Object { $_.files -join ', ' }
          if (-not ($hist.scans.files -match 'बिल')) { throw "history lost the file name" }
          # Excel keeps the learned item list open (others may read it, not write): corrections still save
          $scan = Invoke-RestMethod "http://127.0.0.1:5099/scan?format=json" -Method Post -Headers @{ 'X-API-Key' = 'ci-key-123' } `
            -Form @{ files = Get-Item test-files\a_bill.jpg }
          $learned = "config\item_master.learned.csv"
          if (-not (Test-Path $learned)) { Set-Content $learned "SKU No./Item ID.,Size,Supplier" }
          $excel = [IO.File]::Open((Resolve-Path $learned), 'Open', 'ReadWrite', 'Read')
          $scan.items[0].size = 'XXXL'
          $body = @{ scan_id = $scan.scan_id; header = $scan.header; items = $scan.items } | ConvertTo-Json -Depth 5
          $r = Invoke-WebRequest http://127.0.0.1:5099/csv -Method Post -ContentType 'application/json' -Body $body -Headers @{ 'X-API-Key' = 'ci-key-123' }
          $excel.Close()
          "corrections with the learned list open: $($r.StatusCode) / $($r.Headers['X-VBOCR-Learn-Error'])"
          if ($r.StatusCode -ne 200 -or -not $r.Headers['X-VBOCR-Learn-Error']) { throw "saving corrections failed while the learned list was open" }
          $saved = Invoke-RestMethod "http://127.0.0.1:5099/history/$($scan.scan_id)" -Headers @{ 'X-API-Key' = 'ci-key-123' }
          if ($saved.items[0].size -ne 'XXXL') { throw "the correction was not saved in the history" }

          Get-CimInstance Win32_Process | Where-Object { $_.CommandLine -like '*serve --port 5099*' } | ForEach-Object { Stop-Process -Id $_.ProcessId -Force }
          if (Get-ChildItem $temp -Filter 'vbocr_*') { throw "temporary files left behind" }

      - name: autostart-on.bat starts the server hidden (port 5000)
        shell: pwsh
        run: |
          cmd /c "autostart-on.bat < NUL"
          for ($i = 0; $i -lt 90; $i++) {
            try { if ((Invoke-RestMethod http://127.0.0.1:5000/health).status -eq 'ok') { break } } catch {}
            Start-Sleep 2
          }
          (Invoke-RestMethod http://127.0.0.1:5000/health).status
          if (-not (Test-Path logs\server.log)) { throw "logs\server.log missing" }
          cmd /c "autostart-off.bat < NUL"
          if (Test-Path "$env:APPDATA\Microsoft\Windows\Start Menu\Programs\Startup\VB OCR server.vbs") { throw "still in Startup" }

      - name: update.bat stops the servers and updates
        shell: pwsh
        run: |
          cmd /c "update.bat < NUL"
          if ($LASTEXITCODE -ne 0) { throw "update.bat failed" }
          Start-Sleep 3
          $running = Get-CimInstance Win32_Process | Where-Object { $_.CommandLine -like '*vbocr serve*' }
          if ($running) { throw "server still running" }

      - name: Logs
        if: always()
        shell: pwsh
        run: |
          if (Test-Path server.log) { Get-Content server.log -Tail 80 }
          if (Test-Path logs\server.log) { Get-Content logs\server.log -Tail 40 }
          if (Test-Path logs\last-error.txt) { Get-Content logs\last-error.txt }

  # A PC without Python: install.bat must download Python 3.11 from python.org, check its
  # signature, install it for the user and carry on. Every other Python is hidden from it.
  windows-no-python:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      VBOCR_YES: "1"
    steps:
      - uses: actions/checkout@v5
      - name: install.bat in a folder whose path is too long (long paths off)
        shell: pwsh
        run: |
          $key = 'HKLM:\SYSTEM\CurrentControlSet\Control\FileSystem'
          $before = (Get-ItemProperty $key -Name LongPathsEnabled -ErrorAction SilentlyContinue).LongPathsEnabled
          Set-ItemProperty $key -Name LongPathsEnabled -Value 0
          $deep = "D:\Users\Shop Owner\OneDrive - Sri Lakshmi Textiles Pvt Ltd\Downloads\vbocr-main (1)\vbocr-main"
          New-Item -ItemType Directory $deep -Force | Out-Null
          Copy-Item install.bat $deep
          $out = cmd /c "`"$deep\install.bat`" < NUL" 2>&1 | Out-String
          $code = $LASTEXITCODE
          Set-ItemProperty $key -Name LongPathsEnabled -Value ([int]$before)
          $out
          if ($code -ne 1 -or $out -notmatch 'too long') { throw "long folder path not reported" }
          if (Test-Path "$deep\.venv") { throw "it went on installing" }

      - name: install.bat with no Python on the PC, in a folder with spaces
        shell: pwsh
        run: |
          # like C:\VERP ocr: install folder with spaces
          Copy-Item . "D:\VB OCR test" -Recurse
          Set-Location "D:\VB OCR test"
          $env:PATH = "C:\Windows\System32;C:\Windows\System32\WindowsPowerShell\v1.0;C:\Windows\System32\Wbem"
          $hidden = (Get-Command py, python -ErrorAction SilentlyContinue)
          if ($hidden) { $hidden | Format-Table Name, Source; throw "a Python is still visible" }
          cmd /c "install.bat < NUL"
          if ($LASTEXITCODE -ne 0) { throw "install.bat failed ($LASTEXITCODE)" }
          $base = .venv\Scripts\python.exe -c "import sys; print(sys.base_prefix)"
          "venv made from: $base"
          if ($base -notlike "*\Programs\Python\Python311*") { throw "the venv does not use the downloaded Python" }
          .venv\Scripts\python.exe -m vbocr --version
          # running install.bat again uses the Python installed the first time (no new download)
          $again = cmd /c "install.bat < NUL"
          if ($again -match 'Downloading https://www.python.org') { throw "downloaded Python a second time" }
          if ($LASTEXITCODE -ne 0) { throw "second install.bat failed" }
